project_id = "convivio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "convivio://auth/callback"
additional_redirect_urls = ["convivio://auth/callback"]
enable_signup = true

[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.claim-membership]
verify_jwt = false

[functions.maintenance]
verify_jwt = false
